function bindPair(id,max){for(const end of ['a','b'])$(id+end).onchange=()=>{let a=+$(id+'a').value,b=+$(id+'b').value;if(a>b){if(end==='a')b=a;else a=b}state[id]=[a,b];renderPanel()}}
function renderPanel(){let pet=+P.value,p=D.pets[pet],out='',bindings=[];if(tab==='potential'){let grand=0,power=0,bs=D.branches.filter(b=>b.pet===pet);out='<div class="actions"><button class="btn" id="maxAll">'+t('max')+'</button><button class="btn" id="zeroAll">'+t('reset')+'</button></div>';for(const b of bs){let id='b'+b.id,[a,z]=range(id,55),c=sum(b.rows,a,z),pw=inc(b.rows,a,z),row=at(b.rows,z);grand+=c;power+=pw;out+=`<div class="branch"><h3>${t(branchKeys[b.id-201326853])}</h3>${pair(id,55,a,z)}${line(t('serum'),n(c))}${line(t('power'),n(pw))}${line(t('gate'),row?row[2]:0)}${row?effectLines(row[4]):''}</div>`;bindings.push(()=>bindPair(id,55))}out+=total(t('total')+' · '+t('serum'),grand)+line(t('power'),n(power))+warn('unitswarn');bindings.push(()=>{$('maxAll').onclick=()=>{bs.forEach(b=>state['b'+b.id]=[0,55]);renderPanel()};$('zeroAll').onclick=()=>{bs.forEach(b=>state['b'+b.id]=[0,0]);renderPanel()}})}else if(tab==='skill'){let id='s'+pet,[a,b]=range(id,45),r=D.skills[pet],row=at(r,b);out=`<h2>${t(pet===201326762?'mind':'shield')}</h2>${pair(id,45,a,b)}${total(t('crystal'),sum(r,a,b))}${line(t('power'),n(inc(r,a,b)))}${line(t('skillgate'),row?row[2]:0)}${line(t('raw'),row?row[4].join(' / '):'—')}${warn('unitswarn')}`;bindings.push(()=>bindPair(id,45))}else if(tab==='trust'||tab==='health'){let r=p[tab],max=r.length-1,id=tab+pet,[a,b]=range(id,max),v=r.slice(a,b).reduce((s,x)=>s+x[1],0),row=r[b];out=pair(id,max,a,b)+(tab==='trust'?total(t('xp'),v)+line(t('healthgate'),row[2])+effectLines(row[3]):line(t('raw')+' · '+t('xp'),n(v))+effectLines(row[2]))+warn('unitswarn');bindings.push(()=>bindPair(id,max))}else if(tab==='genes'){const groups=[...new Set(D.genes.map(x=>x.g))],group=state.g??groups[0],rs=D.genes.filter(x=>x.g===group),sums={};for(const r of D.genes.filter(x=>picked.has(x.gid)))for(let i=0;i<r.es.length;i+=2)sums[r.es[i]]=(sums[r.es[i]]||0)+r.es[i+1];out=warn('researchwarn')+`<label>${t('group')}<select id="g">${groups.map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select></label>`+rs.map(r=>`<label class="line"><span><input type="checkbox" data-gid="${r.gid}" ${picked.has(r.gid)?'checked':''}>${t('node')} ${r.gid}</span><strong>${esc(r.es.join(' / '))}</strong></label>`).join('')+`<button id="clearG" class="btn">${t('reset')}</button>`+total(t('node'),picked.size)+effectLines(Object.entries(sums).flatMap(([k,v])=>[k,v]))+warn('unitswarn');bindings.push(()=>{$('g').onchange=()=>{state.g=+$('g').value;renderPanel()};$('clearG').onclick=()=>{picked.clear();renderPanel()};document.querySelectorAll('[data-gid]').forEach(x=>x.onchange=()=>{let g=+x.dataset.gid;x.checked?picked.add(g):picked.delete(g);renderPanel()})})}else if(tab==='zombies'){let idx=state.z??0,r=D.warriors[idx],q=state.q??1000;out=`<label>${t('levels')}<select id="z">${D.warriors.map((w,i)=>`<option value="${i}" ${i===idx?'selected':''}>${w.lv+1} · ${w.hall+1}</option>`).join('')}</select></label><label>${t('quantity')}<input id="q" type="number" min="1" max="100000000" value="${q}"></label>`+line(t('attack'),n(r.atk))+line(t('defense'),n(r.def))+line(t('hp'),n(r.hp))+line(t('power'),n(r.power))+ '<h3>'+t('cost')+'</h3>';for(let i=0;i<r.cost.length;i+=2)out+=line(t(resources[r.cost[i]]),n(r.cost[i+1]*q));out+=warn('unitswarn');bindings.push(()=>{$('z').onchange=()=>{state.z=+$('z').value;renderPanel()};$('q').onchange=()=>{state.q=Math.max(1,Math.min(1e8,Math.floor(+$('q').value||1)));renderPanel()}})}else{if(L.value==='hr')out=warn('quizwarn');else{let qs=D.quiz.filter(x=>x.pet===pet);out=qs.map(q=>{let l=q.loc[L.value];return `<details><summary>${esc(l[0])}</summary><ol>${l.slice(1).map((v,i)=>`<li class="${q.correct===i+1?'correct':''}">${esc(v)}</li>`).join('')}</ol>${line(t('correct'),l[q.correct])}${line(t('reward'),q.reward)}</details>`}).join('')}}$('panel').innerHTML=out;bindings.forEach(f=>f())}
function render(){document.documentElement.lang=L.value;document.documentElement.dir=L.value==='ar'?'rtl':'ltr';$('title').textContent=t('title');$('lead').textContent=t('lead');$('heroLabel').textContent=t('hero');P.options[0].textContent=L.value==='ru'?'Люси':'Lucy';P.options[1].textContent=L.value==='ru'?'Сая':'Saya';$('tabs').innerHTML=tabs.map(k=>`<button data-tab="${k}" class="${k===tab?'active':''}">${t(k)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});renderPanel()}
const params=new URLSearchParams(location.search),embedded=params.get('embedded')==='1';let initial=params.get('lang')||(navigator.language||'ru').split('-')[0];if(D.ui[initial])L.value=initial;if(embedded){document.querySelector('header').hidden=true;document.querySelector('footer').hidden=true;document.body.style.background='transparent';document.querySelector('main').style.padding='0';document.querySelector('main').style.maxWidth='none'}window.setHubLanguage=function(value){if(D.ui[value]&&L.value!==value){L.value=value;render()}};L.onchange=render;P.onchange=renderPanel;render();
</script></body></html>
