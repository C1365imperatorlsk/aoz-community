<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AOZ Community Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b111a;color:#e7edf5;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:24px;margin:0;letter-spacing:1px}small,p{color:#a8b7c8}small{display:block}section{background:#131e2c;border:1px solid #27384b;border-radius:18px;padding:20px;margin:12px 0}h2{font-size:19px;margin:0 0 18px}label{display:block;font-size:13px;color:#a8b7c8;margin:12px 0 6px}select,button{width:100%;font:inherit;border-radius:10px;padding:12px;border:1px solid #384b61;background:#0b111a;color:#e7edf5}header select{width:auto}button{margin-top:18px;background:#65d4fa;color:#07121b;border:0;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #283649}.line strong{font-variant-numeric:tabular-nums}a{color:#65d4fa}footer{text-align:center;color:#a8b7c8;font-size:12px;margin-top:20px}#result[hidden]{display:none} .tag{color:#65d4fa;font-size:11px;letter-spacing:2px;font-weight:bold;margin-bottom:6px} </style></head><body><main><header><div><div class="tag">AOZ / HUB</div><h1>COMMUNITY</h1><small id="sub">Игровые инструменты</small></div><select id="lang" aria-label="Язык / Language"><option value="ru">RU</option><option value="en">EN</option></select></header><section><h2 id="heading">🏗 Строительство</h2><label for="version" id="versionLabel">Версия игры</label><select id="version"><option value="global">Оригинал / Global</option><option value="v3">China V3</option></select><label id="buildingLabel">Здание</label><div id="building">Главное здание</div><div class="grid"><div><label for="from" id="fromLabel">Текущий уровень</label><select id="from"></select></div><div><label for="to" id="toLabel">Целевой уровень</label><select id="to"></select></div></div><button id="calc">Рассчитать ресурсы</button></section><section id="result" hidden aria-live="polite"></section><footer id="foot">AOZ COMMUNITY • тестовая версия 0.1</footer></main><script>
const $=id=>document.getElementById(id), data={global:{21:{cost:[12606040,12606040,2618170,1018180,0],req:{ru:['Городская стена — 20','Минеральная шахта — 20'],en:['City Wall — 20','Mineral Mine — 20']}}},v3:{}};
const t={ru:{sub:'Игровые инструменты',heading:'🏗 Строительство',versionLabel:'Версия игры',buildingLabel:'Здание',building:'Главное здание',fromLabel:'Текущий уровень',toLabel:'Целевой уровень',calc:'Рассчитать ресурсы',foot:'AOZ COMMUNITY • тестовая версия 0.1',names:['🌾 Продовольствие','🛢 Нефть','🔩 Сталь','💎 Минералы','☢ Уран'],cost:'Стоимость улучшения',req:'Обязательные здания',note:'Без стоимости улучшения обязательных зданий. Данные сторонних справочников, не подтверждены разработчиком.',missing:'Для выбранного диапазона пока нет проверенных данных. В демоверсии доступен оригинал, 20 → 21.',source:'Источники'},en:{sub:'Game tools',heading:'🏗 Building calculator',versionLabel:'Game version',buildingLabel:'Building',building:'Main Hall',fromLabel:'Current level',toLabel:'Target level',calc:'Calculate resources',foot:'AOZ COMMUNITY • demo 0.1',names:['🌾 Food','🛢 Oil','🔩 Steel','💎 Minerals','☢ Uranium'],cost:'Upgrade cost',req:'Required buildings',note:'Prerequisite upgrade costs excluded. Unofficial community data.',missing:'Data unavailable for this range. Demo supports Global, 20 → 21.',source:'Sources'}};
function options(el,a,b,v){el.replaceChildren(...Array.from({length:b-a+1},(_,i)=>new Option(a+i,a+i)));el.value=String(Math.min(b,Math.max(a,v)))}options($('from'),1,40,20);options($('to'),21,41,21);function clear(){$('result').hidden=true} $('from').onchange=()=>{options($('to'),+ $('from').value+1,41,+$('to').value);clear()};$('to').onchange=clear;$('version').onchange=clear;
$('lang').onchange=()=>{const l=$('lang').value;document.documentElement.lang=l;for(const k of ['sub','heading','versionLabel','buildingLabel','building','fromLabel','toLabel','calc','foot'])$(k).textContent=t[l][k];clear()};$('calc').onclick=()=>{const l=$('lang').value,s=t[l],a=+$('from').value,b=+$('to').value,rows=[];for(let i=a+1;i<=b;i++)rows.push(data[$('version').value][i]);const r=$('result');r.hidden=false;if(rows.some(x=>!x)){r.textContent=s.missing;return}const totals=Array.from({length:5},(_,i)=>rows.reduce((n,x)=>n+x.cost[i],0));r.innerHTML=`<h2>${s.cost}: ${a} → ${b}</h2>`+totals.map((n,i)=>`<div class="line"><span>${s.names[i]}</span><strong>${n.toLocaleString(l==='ru'?'ru-RU':'en-US')}</strong></div>`).join('')+`<h3>${s.req}</h3>`+rows.flatMap(x=>x.req[l]).map(x=>`<div>${x}</div>`).join('')+`<p>${s.note}</p><small>${s.source}: <a href="https://aozcodes.com/buildings/main-hall/">AOZ Codes</a> · <a href="https://www.ajackof.com/games/age-of-origins/buildings/age-of-origins-main-hall-city-level-requirements-guide/">A Jack of</a></small>`};
</script></body></html>
