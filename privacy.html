<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOZ Community Hub — Privacy & Terms</title><style>body{background:#0b111a;color:#e7edf5;font:16px system-ui,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:24px 18px}p{line-height:1.6;color:#c4d0df}h2{font-size:21px;border-top:1px solid #40536b;padding-top:18px}a{color:#8bdcff;overflow-wrap:anywhere}select{font:inherit;background:#172638;color:#e7edf5;padding:9px;border-radius:8px}small{color:#a8b7c8}</style></head><body><main><h1>AOZ COMMUNITY HUB</h1><select id="language" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option><option value="vi">Tiếng Việt</option><option value="ar">العربية</option><option value="zh">繁體中文</option><option value="hr">Hrvatski</option><option value="it">Italiano</option></select><div id="content"></div></main><script>const data={"ru":["Политика конфиденциальности","Правила использования","Контакты","Независимый фанатский проект. Не связан официально с разработчиками Age of Origins или Telegram.","Оператор: владелец AOZ Community Hub и @AOZV3CommunityBot. Калькуляторы и редактор работают на устройстве; язык, уровни, запасы, черновики и шаблоны могут сохраняться локально. Для подписок и закрытых функций сервер проверяет подписанные данные Telegram. Supabase хранит Telegram ID, язык, выбранные подписки, время согласия и обновления, статус доставки; закрытая тестовая доска может хранить объявления, ID автора и изображения. Публичная доска не запущена.","Статистика PostHog только по добровольному согласию: общие события использования, версия и случайный ID события, без содержимого сообщений и постоянного ID посетителя. Сетевые сервисы могут обрабатывать IP и технические журналы. GitHub Pages размещает сайт, Supabase обслуживает сервер, Telegram обеспечивает вход и уведомления. Копии могут храниться на закрытом Google Диске владельца. Внешние сайты и сторонние боты имеют свои правила.","Статистику можно отключить в приложении. Отписка от уведомлений не удаляет запись автоматически. Для доступа, исправления или удаления данных обратитесь к владельцу; не размещайте личные сведения публично. Локальные данные можно очистить в клиенте. Данные должны храниться только пока необходимы для работы или закона; при удалении нужно учитывать резервные копии. Порядок удаления и сроки хранения копий ещё уточняются. О существенных изменениях и инцидентах владелец уведомляет по применимым правилам.","Бесплатный справочный сервис. Расчёты могут содержать ошибки; проверяйте их в игре. Не используйте Hub для спама, мошенничества, угроз, незаконного контента, нарушения чужих прав или правил Telegram и игры. Вы отвечаете за сообщения, которые сами отправляете. Доступность и игровые результаты не гарантируются.","Права на игру, товарные знаки и чужие материалы принадлежат соответствующим правообладателям. Лицензия репозитория относится только к материалам, права на которые принадлежат проекту, а не к игровым фактам. Претензии направляйте владельцу с указанием конкретного материала и основания. Hub не принимает платежи, не выступает посредником и не гарантирует сделки; тестовая доска закрыта.","GitHub — публичный раздел обращений. Для персонального запроса попросите закрытый канал связи. Не публикуйте там личные данные, токены или пароли.","Исходный проект и лицензия","Подлинность и безопасность внешних установщиков не подтверждены. Проверяйте источник и цифровую подпись, соблюдайте правила игры.","Статистика добровольная — включите её, если хотите помочь развитию Hub."],"en":["Privacy policy","Terms of use","Contact","Independent fan project. Not officially affiliated with Age of Origins developers or Telegram.","Operator: the owner of AOZ Community Hub and @AOZV3CommunityBot. Calculators and editor run on your device; language, levels, inventory, drafts and templates may be saved locally. The server verifies signed Telegram data for subscriptions and restricted features. Supabase stores Telegram ID, language, subscription choices, consent and update times and delivery status. The private test board may store listings, author ID and images. The public board is not launched.","PostHog analytics are opt-in: general usage events, app version and random event ID, without message content or persistent visitor ID. Network providers may process IP and technical logs. GitHub Pages hosts the site, Supabase provides backend, Telegram provides sign-in and notifications. Backups may be kept in the owner's private Google Drive. External sites and third-party bots have their own policies.","Disable analytics in the app. Unsubscribing does not automatically erase the record. Contact the owner for access, correction or deletion; do not publish personal details. Clear site data in your client to remove local data. Retain data only as necessary for operation or law; deletion must address backups. Deletion procedures and backup retention periods are being finalized. The owner must notify users of material changes and incidents as applicable.","Free reference service. Calculations may be inaccurate; verify in-game. Do not use Hub for spam, fraud, threats, unlawful content, infringement or violations of Telegram or game rules. You are responsible for messages you send. Availability and game results are not guaranteed.","Game, trademark and third-party rights belong to their holders. The repository license covers only material owned by the project, not game facts. Submit specific rights complaints and their basis to the owner. Hub does not process payments, broker or guarantee transactions; the test board is private.","GitHub issues are public. Request a private channel for personal matters. Never post personal data, tokens or passwords there.","Source project and license","External installers' authenticity and safety are not verified. Check source and signature; follow game rules.","Analytics is optional: enable it if you want to help improve Hub."],"es":["Política de privacidad","Condiciones de uso","Contacto","Proyecto independiente de fans, sin afiliación oficial con Age of Origins ni Telegram.","Responsable: propietario de AOZ Community Hub y @AOZV3CommunityBot. Calculadoras y editor funcionan en el dispositivo; idioma, niveles, inventario, borradores y plantillas pueden guardarse localmente. El servidor verifica datos firmados de Telegram. Supabase guarda ID de Telegram, idioma, suscripciones, fechas de consentimiento y cambios y estado de entrega. El tablón privado de prueba puede guardar anuncios, ID del autor e imágenes; no hay tablón público.","Estadísticas PostHog solo con consentimiento: eventos generales, versión e ID aleatorio por evento, sin contenido de mensajes ni ID persistente. Proveedores de red pueden tratar IP y registros técnicos. GitHub Pages aloja el sitio, Supabase el servidor y Telegram facilita acceso y avisos. Las copias pueden guardarse en Google Drive privado. Sitios externos y otros bots tienen políticas propias.","Desactiva las estadísticas en la aplicación. Cancelar avisos no elimina automáticamente el registro. Solicita acceso, corrección o eliminación al propietario sin publicar datos personales. Borra datos del sitio en tu cliente. Conservación solo por necesidades operativas o legales; la eliminación debe considerar copias. Se están definiendo procedimientos y plazos. El propietario notificará cambios importantes e incidentes según corresponda.","Servicio informativo gratuito. Verifica cálculos en el juego. No uses Hub para spam, fraude, amenazas, contenido ilegal, infracciones o incumplimiento de reglas del juego y Telegram. Respondes de tus mensajes. No se garantizan disponibilidad ni resultados.","Los derechos del juego, marcas y materiales ajenos pertenecen a sus titulares. La licencia solo cubre materiales propios, no hechos del juego. Comunica reclamaciones concretas al propietario. Hub no procesa pagos, intermedia ni garantiza transacciones. El tablón de prueba es privado.","Las incidencias GitHub son públicas. Solicita un canal privado para asuntos personales. No publiques datos personales, tokens ni contraseñas.","Código fuente y licencia","Autenticidad y seguridad de instaladores externos sin verificar. Comprueba fuente y firma; respeta las reglas.","Estadísticas opcionales: actívalas si quieres ayudar a mejorar Hub."],"vi":["Chính sách quyền riêng tư","Điều khoản sử dụng","Liên hệ","Dự án người hâm mộ độc lập, không liên kết chính thức với Age of Origins hoặc Telegram.","Đơn vị vận hành: chủ AOZ Community Hub và @AOZV3CommunityBot. Máy tính và trình soạn thảo chạy trên thiết bị; ngôn ngữ, cấp độ, kho, bản nháp và mẫu có thể lưu cục bộ. Máy chủ xác minh dữ liệu Telegram đã ký. Supabase lưu ID Telegram, ngôn ngữ, đăng ký, thời điểm đồng ý, cập nhật và trạng thái gửi. Bảng thử nghiệm riêng có thể lưu tin đăng, ID tác giả và ảnh; chưa mở công khai.","PostHog chỉ bật khi đồng ý: sự kiện chung, phiên bản và ID ngẫu nhiên từng sự kiện, không chứa nội dung tin nhắn hay ID cố định. Nhà cung cấp mạng có thể xử lý IP và nhật ký. GitHub Pages lưu trữ trang, Supabase cung cấp máy chủ, Telegram hỗ trợ đăng nhập và thông báo. Bản sao có thể lưu trong Google Drive riêng. Trang ngoài và bot khác có chính sách riêng.","Tắt thống kê trong ứng dụng. Hủy đăng ký không tự xóa bản ghi. Yêu cầu truy cập, sửa hoặc xóa qua chủ dự án, không đăng dữ liệu cá nhân công khai. Xóa dữ liệu trang trên thiết bị. Chỉ lưu khi cần cho vận hành hoặc luật; xóa phải tính đến bản sao. Đang hoàn thiện quy trình và thời hạn lưu. Chủ dự án thông báo thay đổi quan trọng và sự cố theo quy định.","Dịch vụ tham khảo miễn phí. Kiểm tra phép tính trong trò chơi. Không dùng để spam, lừa đảo, đe dọa, nội dung bất hợp pháp, xâm phạm quyền hoặc vi phạm quy tắc Telegram và trò chơi. Bạn chịu trách nhiệm về tin đã gửi. Không bảo đảm tính sẵn có hay kết quả.","Quyền trò chơi, thương hiệu và tài liệu bên ngoài thuộc chủ sở hữu. Giấy phép chỉ áp dụng cho tài liệu của dự án, không phải dữ kiện trò chơi. Gửi khiếu nại cụ thể cho chủ dự án. Hub không xử lý thanh toán, làm trung gian hay bảo đảm giao dịch. Bảng thử nghiệm là riêng tư.","Mục báo lỗi GitHub công khai. Yêu cầu kênh riêng cho vấn đề cá nhân. Không đăng dữ liệu cá nhân, mã thông báo hay mật khẩu.","Mã nguồn và giấy phép","Chưa xác minh tính xác thực và an toàn của tệp cài đặt ngoài. Kiểm tra nguồn và chữ ký; tuân thủ quy tắc.","Thống kê tùy chọn: bật nếu muốn giúp cải thiện Hub."],"ar":["سياسة الخصوصية","شروط الاستخدام","التواصل","مشروع مستقل للمعجبين، غير تابع رسميًا لمطوري Age of Origins أو Telegram.","المشغل: مالك AOZ Community Hub و @AOZV3CommunityBot. تعمل الحاسبات والمحرر على جهازك؛ قد تحفظ اللغة والمستويات والمخزون والمسودات والقوالب محليًا. يتحقق الخادم من بيانات Telegram الموقعة. يخزن Supabase معرف Telegram واللغة والاشتراكات وأوقات الموافقة والتحديث وحالة التسليم. قد تخزن لوحة الاختبار الخاصة الإعلانات ومعرف المؤلف والصور. لم تُفتح لوحة عامة.","إحصاءات PostHog بالموافقة فقط: أحداث عامة وإصدار التطبيق ومعرف عشوائي لكل حدث، دون محتوى الرسائل أو معرف دائم. قد يعالج مزودو الشبكة IP والسجلات. يستضيف GitHub Pages الموقع ويوفر Supabase الخادم ويقدم Telegram الدخول والإشعارات. قد تُحفظ النسخ في Google Drive الخاص بالمالك. للمواقع والبوتات الأخرى سياساتها.","يمكن إيقاف الإحصاءات في التطبيق. إلغاء الاشتراك لا يحذف السجل تلقائيًا. اطلب الوصول أو التصحيح أو الحذف من المالك دون نشر بيانات شخصية. امسح بيانات الموقع محليًا. تحفظ البيانات فقط للضرورة التشغيلية أو القانونية، ويجب مراعاة النسخ عند الحذف. يجري إعداد الإجراءات والمدة. يُبلغ المالك بالتغييرات المهمة والحوادث وفق القواعد.","خدمة مرجعية مجانية. تحقق من الحسابات داخل اللعبة. يحظر استخدامها للرسائل المزعجة أو الاحتيال أو التهديد أو المحتوى غير القانوني أو انتهاك الحقوق وقواعد اللعبة وTelegram. أنت مسؤول عن رسائلك. لا ضمان للتوفر أو النتائج.","حقوق اللعبة والعلامات ومواد الغير لأصحابها. الترخيص يخص مواد المشروع لا حقائق اللعبة. أرسل مطالبات محددة ومبررة للمالك. لا يعالج Hub المدفوعات ولا يتوسط أو يضمن المعاملات. لوحة الاختبار خاصة.","قسم GitHub علني. اطلب قناة خاصة للأمور الشخصية. لا تنشر بيانات شخصية أو رموزًا سرية أو كلمات مرور.","المصدر والترخيص","لم تتحقق أصالة وأمان ملفات التثبيت الخارجية. تحقق من المصدر والتوقيع واتبع القواعد.","الإحصاءات اختيارية؛ فعّلها للمساعدة في تحسين Hub."],"zh":["隱私權政策","使用條款","聯絡","獨立玩家專案，與 Age of Origins 開發商或 Telegram 無官方關係。","管理者：AOZ Community Hub 與 @AOZV3CommunityBot 擁有者。計算器及編輯器在裝置執行；語言、等級、庫存、草稿及範本可能儲存本機。伺服器驗證 Telegram 簽署資料。Supabase 儲存 Telegram ID、語言、訂閱、同意及更新時間、傳送狀態。私人測試公告板可能儲存公告、作者 ID 及圖片；公開板尚未推出。","PostHog 統計須主動同意：一般使用事件、版本及隨機事件 ID，不含訊息內容或持久訪客 ID。網路服務商可能處理 IP 及技術日誌。GitHub Pages 託管網站，Supabase 提供伺服器，Telegram 提供登入及通知。備份可能儲存在擁有者的私人 Google Drive。外部網站及其他機器人有各自政策。","可關閉統計；取消訂閱不會自動刪除記錄。請向擁有者要求存取、更正或刪除，勿公開個資。清除用戶端網站資料可刪除本機資料。只保留營運或法律所需資料，刪除時亦須考慮備份。刪除程序與保存期限仍在完善。重大變更與事故依規則通知。","免費參考服務，請於遊戲核對計算。不得用於垃圾訊息、詐騙、威脅、非法內容、侵權或違反 Telegram 與遊戲規則。自行負責發送的訊息。不保證可用性或結果。","遊戲、商標及第三方素材權利屬各權利人。授權只涵蓋專案自有素材，不涵蓋遊戲事實。請向擁有者提出具體申訴及理由。Hub 不處理付款、不仲介或保證交易。測試板為私人。","GitHub 問題區公開。個人事務請索取私人管道。勿發布個資、權杖或密碼。","原始碼及授權","外部安裝檔真實性及安全性未驗證。檢查來源及簽章，遵守遊戲規則。","統計為選用功能，願意協助改善 Hub 時再開啟。"],"hr":["Pravila privatnosti","Uvjeti korištenja","Kontakt","Neovisni projekt obožavatelja, bez službene veze s Age of Origins ili Telegramom.","Voditelj: vlasnik AOZ Community Hub i @AOZV3CommunityBot. Kalkulatori i uređivač rade na uređaju; jezik, razine, zalihe, skice i predlošci mogu biti lokalno pohranjeni. Poslužitelj provjerava potpisane podatke Telegrama. Supabase čuva Telegram ID, jezik, pretplate, vrijeme pristanka i ažuriranja te status dostave. Privatna testna ploča može čuvati oglase, ID autora i slike; javna ploča nije pokrenuta.","PostHog statistika traži pristanak: opći događaji, verzija i slučajni ID događaja, bez sadržaja poruka ili trajnog ID-a. Mrežni pružatelji mogu obrađivati IP i tehničke zapise. GitHub Pages udomljuje stranicu, Supabase poslužitelj, Telegram prijavu i obavijesti. Kopije mogu biti na privatnom Google Driveu. Vanjske stranice i drugi botovi imaju vlastita pravila.","Isključite statistiku u aplikaciji. Odjava ne briše zapis automatski. Zatražite pristup, ispravak ili brisanje od vlasnika bez javnog iznošenja osobnih podataka. Obrišite podatke stranice u klijentu. Čuvanje samo dok je potrebno za rad ili zakon; brisanje mora obuhvatiti kopije. Postupak i rokovi se dovršavaju. Vlasnik obavještava o bitnim izmjenama i incidentima prema pravilima.","Besplatna referentna usluga. Provjerite izračune u igri. Ne koristite Hub za spam, prijevare, prijetnje, nezakonit sadržaj, povrede prava ili pravila Telegrama i igre. Odgovorni ste za svoje poruke. Dostupnost i rezultati nisu zajamčeni.","Prava igre, žigova i tuđih materijala pripadaju nositeljima. Licenca pokriva vlastite materijale, ne činjenice igre. Konkretne pritužbe uputite vlasniku. Hub ne obrađuje plaćanja, ne posreduje niti jamči transakcije. Testna ploča je privatna.","GitHub prijave su javne. Zatražite privatni kanal za osobna pitanja. Ne objavljujte osobne podatke, tokene ili lozinke.","Izvorni kod i licenca","Autentičnost i sigurnost vanjskih instalacijskih datoteka nisu provjerene. Provjerite izvor i potpis; poštujte pravila.","Statistika nije obvezna; uključite je ako želite pomoći razvoju Huba."],"it":["Informativa sulla privacy","Condizioni d'uso","Contatti","Progetto indipendente di appassionati, senza affiliazione ufficiale con Age of Origins o Telegram.","Gestore: proprietario di AOZ Community Hub e @AOZV3CommunityBot. Calcolatori ed editor funzionano sul dispositivo; lingua, livelli, inventario, bozze e modelli possono essere salvati localmente. Il server verifica dati Telegram firmati. Supabase salva ID Telegram, lingua, iscrizioni, tempi di consenso e aggiornamento e stato consegne. La bacheca privata di prova può salvare annunci, ID autore e immagini; quella pubblica non è attiva.","PostHog solo con consenso: eventi generali, versione e ID casuale per evento, senza contenuto dei messaggi o ID persistente. I fornitori di rete possono trattare IP e log. GitHub Pages ospita il sito, Supabase il backend, Telegram accesso e avvisi. I backup possono essere su Google Drive privato. Siti esterni e altri bot hanno proprie informative.","Disattiva statistiche nell'app. Annullare l'iscrizione non cancella automaticamente il record. Richiedi accesso, correzione o cancellazione al proprietario senza pubblicare dati personali. Cancella i dati del sito nel client. Conservazione solo per esigenze operative o legali; la cancellazione deve considerare i backup. Procedure e tempi in definizione. Il gestore informa su modifiche importanti e incidenti secondo le regole.","Servizio informativo gratuito. Verifica i calcoli nel gioco. Non usare Hub per spam, frodi, minacce, contenuti illegali, violazioni di diritti o regole del gioco e Telegram. Sei responsabile dei tuoi messaggi. Disponibilità e risultati non garantiti.","Diritti di gioco, marchi e materiali altrui appartengono ai titolari. La licenza copre materiali propri, non fatti di gioco. Invia contestazioni specifiche al proprietario. Hub non elabora pagamenti, non intermedia né garantisce transazioni. La bacheca di prova è privata.","Le segnalazioni GitHub sono pubbliche. Chiedi un canale privato per questioni personali. Non pubblicare dati personali, token o password.","Sorgente e licenza","Autenticità e sicurezza degli installer esterni non verificate. Controlla fonte e firma; segui le regole.","Statistiche facoltative: attivale se vuoi aiutare a migliorare Hub."]},sel=document.getElementById('language');const requested=new URLSearchParams(location.search).get('lang')||navigator.language.slice(0,2);sel.value=data[requested]?requested:'en';function render(){const k=sel.value,l=data[k],root=document.getElementById('content');document.documentElement.lang=k;document.documentElement.dir=k==='ar'?'rtl':'ltr';root.replaceChildren();const add=(tag,str,id)=>{const n=document.createElement(tag);n.textContent=str;if(id)n.id=id;root.append(n);return n};const link=(str,url)=>{const a=add('a',str);a.href=url;a.target='_blank';a.rel='noopener noreferrer'};add('p',l[3]);add('small','2026-11-26');add('h2',l[0],'privacy');for(let i=4;i<=6;i++)add('p',l[i]);add('h2',l[1],'terms');for(let i=7;i<=8;i++)add('p',l[i]);add('h2',l[2],'contact');link(l[2],'https://github.com/C1365imperatorlsk/aoz-community/issues');add('p',l[9]);link(l[10],'https://github.com/C1365imperatorlsk/aoz-community/blob/main/LICENSE');const id=location.hash.slice(1);if(id)document.getElementById(id)?.scrollIntoView()}sel.onchange=render;render();</script></body></html>
