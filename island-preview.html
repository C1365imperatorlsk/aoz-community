<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOZ Community Hub — Island</title><link rel="stylesheet" href="data/island-ui.css"><style>html{background:#091824;color:#e7f7ff;font-family:Arial,sans-serif}body{margin:0;padding:14px}main{max-width:760px;margin:auto}#locale{background:#102938;color:white;border:1px solid #375c6d;border-radius:8px;margin-bottom:12px;padding:8px;font-size:12px}section{margin:0}</style></head><body><main><select id="locale" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option><option value="vi">Tiếng Việt</option><option value="ar">العربية</option><option value="zh">繁體中文</option><option value="hr">Hrvatski</option><option value="it">Italiano</option></select><div id="islandRoot"></div></main><script src="data/island-source.js"></script><script src="data/island-core.js"></script><script src="data/island-art.js"></script><script src="data/island-names.js"></script><script src="data/island-locales.js"></script><script src="data/island-ui.js"></script><script>const language=document.getElementById('locale');const island=IslandUI.install(document.getElementById('islandRoot'),()=>language.value);language.onchange=()=>{document.documentElement.lang=language.value;document.documentElement.dir=language.value==='ar'?'rtl':'ltr';island.render()};island.render();</script></body></html>
